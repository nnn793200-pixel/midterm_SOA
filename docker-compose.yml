services:
  # ==========================================================================
  # 1. POSTGRESQL 16 (Khởi tạo 4 Databases độc lập: Database-per-Service)
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: ibanking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-multiple-dbs.sql:/docker-entrypoint-initdb.d/init-multiple-dbs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal_network

  # ==========================================================================
  # 2. REDIS 7 (OTP TTL 300s, Lua Verify, Distributed Lock & Idempotency Cache)
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: ibanking-redis
    restart: unless-stopped
    expose:
      - "6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal_network

  # ==========================================================================
  # 3. MAILPIT (SMTP nội bộ 1025 & Giao diện Web xem Email cổng 8025)
  # ==========================================================================
  mailpit:
    image: axllent/mailpit:latest
    container_name: ibanking-mailpit
    restart: unless-stopped
    expose:
      - "1025"
    ports:
      - "8025:8025"
    networks:
      - public_network
      - internal_network

  # ==========================================================================
  # 4. MICROSERVICE 1: auth-account-service (Port 8001 nội bộ -> account_db)
  # ==========================================================================
  auth-account-service:
    build:
      context: ./services/auth-account-service
      dockerfile: Dockerfile
    container_name: ibanking-auth-account-service
    restart: unless-stopped
    environment:
      SERVICE_NAME: auth-account-service
      ACCOUNT_DATABASE_URL: ${ACCOUNT_DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/account_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-tdtu-soa-2026-super-secret-jwt-key-9999}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-tdtu-soa-2026-internal-service-secret-9999}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
    expose:
      - "8001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal_network

  # ==========================================================================
  # 5. MICROSERVICE 2: tuition-service (Port 8002 nội bộ -> tuition_db)
  # ==========================================================================
  tuition-service:
    build:
      context: ./services/tuition-service
      dockerfile: Dockerfile
    container_name: ibanking-tuition-service
    restart: unless-stopped
    environment:
      SERVICE_NAME: tuition-service
      TUITION_DATABASE_URL: ${TUITION_DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/tuition_db}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-tdtu-soa-2026-internal-service-secret-9999}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
    expose:
      - "8002"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal_network

  # ==========================================================================
  # 6. MICROSERVICE 4: notification-otp-service (Port 8004 nội bộ -> notification_db + Redis + Mailpit)
  # ==========================================================================
  notification-otp-service:
    build:
      context: ./services/notification-otp-service
      dockerfile: Dockerfile
    container_name: ibanking-notification-otp-service
    restart: unless-stopped
    environment:
      SERVICE_NAME: notification-otp-service
      NOTIFICATION_DATABASE_URL: ${NOTIFICATION_DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/notification_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-300}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-ibanking-noreply@tdtu.edu.vn}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-TDTU iBanking System}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-tdtu-soa-2026-internal-service-secret-9999}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
    expose:
      - "8004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - internal_network

  # ==========================================================================
  # 7. MICROSERVICE 3: payment-service [Saga Orchestrator] (Port 8003 nội bộ -> payment_db + Redis)
  # ==========================================================================
  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: ibanking-payment-service
    restart: unless-stopped
    environment:
      SERVICE_NAME: payment-service
      PAYMENT_DATABASE_URL: ${PAYMENT_DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/payment_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-tdtu-soa-2026-super-secret-jwt-key-9999}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-300}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-tdtu-soa-2026-internal-service-secret-9999}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
      AUTH_ACCOUNT_SERVICE_URL: ${AUTH_ACCOUNT_SERVICE_URL:-http://auth-account-service:8001}
      TUITION_SERVICE_URL: ${TUITION_SERVICE_URL:-http://tuition-service:8002}
      NOTIFICATION_OTP_SERVICE_URL: ${NOTIFICATION_OTP_SERVICE_URL:-http://notification-otp-service:8004}
    expose:
      - "8003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-account-service:
        condition: service_started
      tuition-service:
        condition: service_started
      notification-otp-service:
        condition: service_started
    networks:
      - internal_network

  # ==========================================================================
  # 8. API GATEWAY (Port 8000 công khai -> Single Entry Point)
  # ==========================================================================
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: ibanking-api-gateway
    restart: unless-stopped
    environment:
      SERVICE_NAME: api-gateway
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-tdtu-soa-2026-super-secret-jwt-key-9999}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-tdtu-soa-2026-internal-service-secret-9999}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
      ENABLE_DEMO_ENDPOINTS: ${ENABLE_DEMO_ENDPOINTS:-true}
      AUTH_ACCOUNT_SERVICE_URL: ${AUTH_ACCOUNT_SERVICE_URL:-http://auth-account-service:8001}
      TUITION_SERVICE_URL: ${TUITION_SERVICE_URL:-http://tuition-service:8002}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL:-http://payment-service:8003}
      NOTIFICATION_OTP_SERVICE_URL: ${NOTIFICATION_OTP_SERVICE_URL:-http://notification-otp-service:8004}
    ports:
      - "8000:8000"
    depends_on:
      - auth-account-service
      - tuition-service
      - payment-service
      - notification-otp-service
    networks:
      - public_network
      - internal_network

  # ==========================================================================
  # 9. FRONTEND WEB UI (React + Vite + Tailwind CSS -> Port 5173)
  # ==========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ibanking-frontend
    restart: unless-stopped
    environment:
      VITE_API_GATEWAY_URL: ${VITE_API_GATEWAY_URL:-http://localhost:8000/api/v1}
      VITE_MAILPIT_WEB_URL: ${VITE_MAILPIT_WEB_URL:-http://localhost:8025}
    ports:
      - "5173:5173"
    depends_on:
      - api-gateway
    networks:
      - public_network

volumes:
  postgres_data:
  redis_data:

networks:
  public_network:
    driver: bridge
  internal_network:
    driver: bridge
    internal: true
